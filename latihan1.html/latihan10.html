<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar List dan ATK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .judul {
            color: #1565c0;
            font-weight: bold;
            border-left: 5px solid #1565c0;
            padding-left: 12px;
            margin-bottom: 20px;
        }

        .kartu {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #dbeafe;
        }

        .pink {
            color: #e91e63;
        }

        .biru {
            color: #1565c0;
        }

        .hijau {
            color: #198754;
        }

        .table thead th {
            background-color: #1565c0;
            color: white;
        }

        .table tbody tr:nth-child(even) td {
            background-color: #eaf2ff;
        }

        .table tbody tr:nth-child(odd) td {
            background-color: white;
        }

        .table th,
        .table td {
            padding: 12px;
            border-color: #cbdcf5;
        }
    </style>
</head>

<body>
    <div class="container py-4">

        <div class="kartu">
            <h3 class="judul">3. Daftar List</h3>

            <ol type="a">
                <li class="pink">Pink</li>
                <li class="biru">Biru</li>
                <li class="hijau">Hijau meliputi
                    <ol type="1">
                        <li>Mobil</li>
                        <li>Motor</li>
                        <li>Sepeda</li>
                    </ol>
                </li>
                <li>Ayam</li>
                <li>Sapi</li>
                <li>Kelinci</li>
            </ol>
        </div>

        <div class="kartu">
            <h3 class="judul">4. Tabel Daftar ATK</h3>

            <table class="table table-bordered mb-0">
                <thead>
                    <tr>
                        <th style="width: 70px;">No</th>
                        <th>Daftar ATK</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Penggaris</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Pensil</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Pulpen</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Buku</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
