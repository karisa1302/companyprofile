<!DOCTYPE html>
<html lang="en">


<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>carousel</title>


   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>
</head>


<body>


   <div class="container mt-4">




      <div id="contoh" class="carousel slide">


         <div class="carousel-inner">
            <div class="carousel-item active">
               <img height="400px;" class="rounded mx-auto d-block"
                  src="https://th.bing.com/th/id/OIP.h0TvyfOZZuU4HO6-5jVdxAHaNJ?w=184&h=328&c=7&r=0&o=7&pid=1.7&rm=3">
            </div>


            <div class="carousel-item">
               <img height="400px;" class="rounded mx-auto d-block"
                  src="https://th.bing.com/th/id/OIP.tLMe15aP__h-seD-9wmkVAHaNL?w=184&h=328&c=7&r=0&o=7&pid=1.7&rm=3">
            </div>


            <div class="carousel-item">
               <img height="400px;" class="rounded mx-auto d-block"
                  src="https://th.bing.com/th/id/OIP.-aRMQ3yrQ0aO0Kvst6qn1gHaNK?w=184&h=328&c=7&r=0&o=7&pid=1.7&rm=3">
            </div>
         </div>


         <button class="carousel-control-prev" type="button" data-bs-target="#contoh" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Prev</span>
         </button>


         <button class="carousel-control-next" type="button" data-bs-target="#contoh" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
         </button>


      </div>


   </div>
</body>


</html>
